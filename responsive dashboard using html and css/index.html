<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Dashboard | Abdullah Ahmed</title>
  </head>
  <body>
    <div class="menu">
      <ul>
        <li class="profile">
          <div class="img-box">
            <img src="img/user-200x300.webp" alt="" />
          </div>
          <h2>Abdullah</h2>
        </li>
        <li>
          <a class="active" href="#"
            ><i class="fas fa-home"></i>
            <p>Dashboard</p>
          </a>
        </li>
        <li>
          <a href="#"
            ><i class="fas fa-user-group"></i>
            <p>Clients</p>
          </a>
        </li>
        <li>
          <a href="#"
            ><i class="fas fa-table"></i>
            <p>Product</p>
          </a>
        </li>
        <li>
          <a href="#"
            ><i class="fas fa-chart-pie"></i>
            <p>Charts</p>
          </a>
        </li>
        <li>
          <a href="#"
            ><i class="fas fa-star"></i>
            <p>Favorite</p>
          </a>
        </li>

        <li>
          <a href="#"
            ><i class="fas fa-cog"></i>
            <p>Settings</p>
          </a>
        </li>

        <li class="logout">
          <a href="#"
            ><i class="fas fa-sign-out"></i>
            <p>Logout</p>
          </a>
        </li>
      </ul>
    </div>

    <div class="content">
      <div class="header">
        <p>dashboard</p>
        <i class="fas fa-chart-bar"></i>
      </div>

      <div class="data-info">
        <div class="box">
          <i class="fas fa-user"></i>
          <div class="data">
            <p>Users</p>
            <span>100</span>
          </div>
        </div>
        <div class="box">
          <i class="fas fa-pen"></i>
          <div class="data">
            <p>Posts</p>
            <span>100</span>
          </div>
        </div>
        <div class="box">
          <i class="fas fa-table"></i>
          <div class="data">
            <p>Products</p>
            <span>100</span>
          </div>
        </div>
        <div class="box">
          <i class="fas fa-dollar"></i>
          <div class="data">
            <p>Revenue</p>
            <span>100</span>
          </div>
        </div>
      </div>

      <div class="header">
        <p>Product</p>
        <i class="fas fa-table"></i>
      </div>

      <table>
        <thead>
          <tr>
            <th>product</th>
            <th>price</th>
            <th>count</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>tv</td>
            <td><span class="price">$100</span></td>
            <td><span class="count">15</span></td>
          </tr>
          <tr>
            <td>tv</td>
            <td><span class="price">$100</span></td>
            <td><span class="count">15</span></td>
          </tr>
          <tr>
            <td>tv</td>
            <td><span class="price">$100</span></td>
            <td><span class="count">15</span></td>
          </tr>
          <tr>
            <td>tv</td>
            <td><span class="price">$100</span></td>
            <td><span class="count">15</span></td>
          </tr>
          <tr>
            <td>tv</td>
            <td><span class="price">$100</span></td>
            <td><span class="count">15</span></td>
          </tr>
          <tr>
            <td>tv</td>
            <td><span class="price">$100</span></td>
            <td><span class="count">15</span></td>
          </tr>
          <tr>
            <td>tv</td>
            <td><span class="price">$100</span></td>
            <td><span class="count">15</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
